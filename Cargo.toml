[package]
name = "studio-patcher"
version = "0.5.3"
edition = "2024"

[[bin]]
name = "studio-patcher"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.151"
zstd = "0.13.3"
mlua = { version = "0.12.0", features = ["luau"] }
regex = "1.13.1"
self-replace = "1.5.0"

[profile.release]
opt-level = 3
strip = true
codegen-units = 1
panic = "abort"
